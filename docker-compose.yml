name: 'oscar'
services:
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: oscar
      POSTGRES_PASSWORD: pass
      POSTGRES_USER: user
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql

  redis:
    image: redis:alpine
    command: ["redis-server", "--save", "1", "1", "--loglevel", "warning"]
    volumes:
      - ./data/redis:/data
    ports:
      - 6379:6379

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    # restart: unless-stopped
    volumes:
      - ./data/mailpit:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  lgtm:
    image: docker.io/grafana/otel-lgtm:latest
    container_name: lgtm
    init: true
    ports:
      - "3030:3000"
      - "3200:3200"
      - "4040:4040"
      - "4317:4317"
      - "4318:4318"
      - "9090:9090"
    volumes:
      - ./data/grafana:/data/grafana
      - ./data/prometheus:/data/prometheus
      - ./data/loki:/data/loki
    environment:
      GF_PATHS_DATA: /data/grafana
      CONTAINER_RUNTIME: docker
      OTEL_COLLECTOR_DEBUG_EXPORTER: ${OTEL_COLLECTOR_DEBUG_EXPORTER:-}
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true
    # OBI eBPF auto-instrumentation (Linux kernel 5.8+ with BTF). Enable with ENABLE_OBI=true in .env:
    # pid: host
    # privileged: true

